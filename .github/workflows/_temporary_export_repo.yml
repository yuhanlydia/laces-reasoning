name: Temporary repository export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/_temporary_export_repo.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: laces-reasoning-source
          path: .
          include-hidden-files: true
          retention-days: 1
