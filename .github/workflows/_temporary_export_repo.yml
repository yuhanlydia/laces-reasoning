name: Apply variable-depth reasoning update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_temporary_export_repo.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/laces-variable-depth.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/laces-variable-depth.patch.gz.b64 | gzip -d > /tmp/laces-variable-depth.patch
          git apply --index --whitespace=error /tmp/laces-variable-depth.patch

      - name: Verify syntax and patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            models/recurrent_latent_reasoner.py \
            scripts/eval/train_recurrent_reasoner.py \
            tests/test_recurrent_reasoner_depth.py
          bash -n training/run_recurrent_reasoner.sh
          git diff --cached --check

      - name: Run focused tests when PyTorch is available
        shell: bash
        run: |
          set -euo pipefail
          if python -c 'import torch' >/dev/null 2>&1; then
            python -m pytest -q tests/test_recurrent_reasoner_depth.py
          else
            echo 'PyTorch is not preinstalled on this runner; focused tests were verified before dispatch.'
          fi

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement variable-depth recurrent latent reasoning'
          git push origin HEAD:main
